name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"

  chaosctl-release:
    name: chaosctl Public Release
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download chaosctl archives from private release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${{ github.ref_name }}" \
            --repo chaosplane-hq/chaosplane \
            --pattern "chaosctl_*" \
            --pattern "checksums.txt" \
            --dir dist

      - name: Filter checksums to chaosctl only
        run: grep "chaosctl_" dist/checksums.txt > dist/chaosctl-checksums.txt

      - name: Create release on chaosctl public repo
        env:
          GH_TOKEN: ${{ secrets.CHAOSCTL_RELEASE_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo chaosplane-hq/chaosctl \
            --title "chaosctl ${{ github.ref_name }}" \
            --notes "chaosctl ${{ github.ref_name }}" \
            --latest \
            dist/chaosctl_* dist/chaosctl-checksums.txt

  helm-release:
    name: Helm Chart
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Login to GHCR OCI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update Chart.yaml version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" charts/chaosplane/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.version }}\"/" charts/chaosplane/Chart.yaml

      - name: Package and push Helm chart
        run: |
          helm package charts/chaosplane
          helm push chaosplane-${{ steps.version.outputs.version }}.tgz oci://ghcr.io/chaosplane-hq/helm-charts
