apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "chaosplane.fullname" . }}-daemon
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "chaosplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: daemon
spec:
  selector:
    matchLabels:
      {{- include "chaosplane.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: daemon
  updateStrategy:
    {{- toYaml .Values.daemon.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "chaosplane.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: daemon
    spec:
      serviceAccountName: {{ include "chaosplane.fullname" . }}-daemon
      hostPID: {{ .Values.daemon.hostPID }}
      hostNetwork: {{ .Values.daemon.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.daemon.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemon.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemon.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: daemon
          image: {{ include "chaosplane.daemon.image" . }}
          imagePullPolicy: {{ .Values.daemon.image.pullPolicy }}
          args:
            - -addr=:{{ .Values.daemon.grpcPort }}
            - -cri-endpoint=unix://{{ .Values.daemon.socketPath }}
          ports:
            - name: grpc
              containerPort: {{ .Values.daemon.grpcPort }}
              hostPort: {{ .Values.daemon.grpcPort }}
              protocol: TCP
          startupProbe:
            grpc:
              port: {{ .Values.daemon.grpcPort }}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            grpc:
              port: {{ .Values.daemon.grpcPort }}
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            grpc:
              port: {{ .Values.daemon.grpcPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.daemon.resources | nindent 12 }}
          securityContext:
            privileged: {{ .Values.daemon.privileged }}
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                {{- toYaml .Values.daemon.capabilities | nindent 16 }}
          volumeMounts:
            - name: containerd-sock
              mountPath: {{ .Values.daemon.socketPath }}
              readOnly: true
            - name: cgroup
              mountPath: /sys/fs/cgroup
            - name: run
              mountPath: /run
      volumes:
        - name: containerd-sock
          hostPath:
            path: {{ .Values.daemon.socketPath }}
            type: Socket
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: run
          emptyDir: {}
