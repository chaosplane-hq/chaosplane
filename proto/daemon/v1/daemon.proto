syntax = "proto3";

package daemon.v1;

option go_package = "github.com/chaosplane-hq/chaosplane/gen/daemon/v1;daemonv1";

service ChaosDaemon {
  rpc ExecNetworkChaos(NetworkChaosRequest) returns (NetworkChaosResponse);
  rpc ExecStressChaos(StressChaosRequest) returns (StressChaosResponse);
  rpc ExecDNSChaos(DNSChaosRequest) returns (DNSChaosResponse);
  rpc ExecHTTPChaos(HTTPChaosRequest) returns (HTTPChaosResponse);
  rpc ExecNodeChaos(NodeChaosRequest) returns (NodeChaosResponse);
  rpc CancelChaos(CancelRequest) returns (CancelResponse);
  rpc GetChaosStatus(StatusRequest) returns (StatusResponse);
}

message NetworkChaosRequest {
  string experiment_id = 1;
  string action = 2;        // delay, loss, corrupt, duplicate
  string target_iface = 3;
  map<string, string> parameters = 4;
}

message NetworkChaosResponse {
  bool success = 1;
  string message = 2;
  string execution_id = 3;
  bool applied = 4;
}

message StressChaosRequest {
  string experiment_id = 1;
  string stressor_type = 2; // cpu, memory, io
  map<string, string> parameters = 3;
}

message StressChaosResponse {
  bool success = 1;
  string message = 2;
  string execution_id = 3;
  bool applied = 4;
}

message DNSChaosRequest {
  string experiment_id = 1;
  string action = 2;        // error, random
  map<string, string> parameters = 3;
}

message DNSChaosResponse {
  bool success = 1;
  string message = 2;
  string execution_id = 3;
  bool applied = 4;
}

message HTTPChaosRequest {
  string experiment_id = 1;
  string action = 2;        // abort, delay, replace
  int32 port = 3;
  map<string, string> parameters = 4;
}

message HTTPChaosResponse {
  bool success = 1;
  string message = 2;
  string execution_id = 3;
  bool applied = 4;
}

message NodeChaosRequest {
  string experiment_id = 1;
  string action = 2;        // shutdown, restart, kernel-panic
  map<string, string> parameters = 3;
}

message NodeChaosResponse {
  bool success = 1;
  string message = 2;
  string execution_id = 3;
  bool applied = 4;
}

message CancelRequest {
  string execution_id = 1;
}

message CancelResponse {
  bool success = 1;
  string message = 2;
}

message StatusRequest {}

message StatusResponse {
  repeated ExecutionStatus executions = 1;
}

message ExecutionStatus {
  string execution_id = 1;
  string experiment_id = 2;
  string type = 3;
  string status = 4;
  string start_time = 5;
}
