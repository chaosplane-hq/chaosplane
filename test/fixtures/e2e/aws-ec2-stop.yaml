apiVersion: chaos.chaosplane.dev/v1alpha1
kind: ChaosExperiment
metadata:
  name: e2e-aws-ec2-stop
  namespace: default
  labels:
    test: e2e
spec:
  target:
    kind: AWSResource
    labelSelector:
      matchLabels:
        service: ec2
  action:
    type: aws-ec2-stop
    parameters:
      instanceId: "i-e2etest"
      region: "us-east-1"
  duration: 30s
