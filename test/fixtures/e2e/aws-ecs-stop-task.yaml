apiVersion: chaos.chaosplane.dev/v1alpha1
kind: ChaosExperiment
metadata:
  name: e2e-aws-ecs-stop-task
  namespace: default
  labels:
    test: e2e
spec:
  target:
    kind: AWSResource
    labelSelector:
      matchLabels:
        service: ecs
  action:
    type: aws-ecs-stop-task
    parameters:
      cluster: "e2e"
      taskId: "arn:aws:ecs:us-east-1:123456:task/test"
  duration: 30s
