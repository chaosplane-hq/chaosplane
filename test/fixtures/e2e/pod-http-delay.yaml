apiVersion: chaos.chaosplane.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: e2e-pod-http-delay
  namespace: default
  labels:
    test: e2e
spec:
  target:
    kind: Pod
    namespace: default
    labelSelector:
      matchLabels:
        app: e2e-target
  action:
    type: pod-http-delay
    parameters:
      port: "8080"
      delayMs: "2000"
      percentage: "100"
  duration: 30s
