apiVersion: chaos.chaosplane.dev/v1alpha1
kind: ChaosExperiment
metadata:
  name: e2e-aws-rds-failover
  namespace: default
  labels:
    test: e2e
spec:
  target:
    kind: AWSResource
    labelSelector:
      matchLabels:
        service: rds
  action:
    type: aws-rds-failover
    parameters:
      dbClusterIdentifier: "e2e-cluster"
      region: "us-east-1"
  duration: 30s
