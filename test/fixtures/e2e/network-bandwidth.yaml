apiVersion: chaos.chaosplane.dev/v1alpha1
kind: ChaosExperiment
metadata:
  name: e2e-network-bandwidth
  namespace: default
  labels:
    test: e2e
spec:
  target:
    kind: Pod
    namespace: default
    labelSelector:
      matchLabels:
        app: e2e-target
  action:
    type: network-bandwidth
    parameters:
      rateMbit: "1"
      burstKB: "32"
      interface: eth0
  duration: 30s
