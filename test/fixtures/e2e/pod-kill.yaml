apiVersion: chaos.chaosplane.dev/v1alpha1
kind: ChaosExperiment
metadata:
  name: e2e-pod-kill
  namespace: default
  labels:
    test: e2e
spec:
  target:
    kind: Pod
    namespace: default
    labelSelector:
      matchLabels:
        app: e2e-target
  action:
    type: pod-kill
    parameters:
      gracePeriodSeconds: "0"
  duration: 30s
