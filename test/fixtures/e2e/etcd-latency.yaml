apiVersion: chaos.chaosplane.dev/v1alpha1
kind: ChaosExperiment
metadata:
  name: e2e-etcd-latency
  namespace: default
  labels:
    test: e2e
spec:
  target:
    kind: Node
    labelSelector:
      matchLabels:
        node-role.kubernetes.io/control-plane: ""
  action:
    type: etcd-latency
    parameters:
      latency: "100ms"
      interface: "eth0"
  duration: 30s
