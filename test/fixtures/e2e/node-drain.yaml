apiVersion: chaos.chaosplane.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: e2e-node-drain
  namespace: default
  labels:
    test: e2e
spec:
  target:
    kind: Node
    labelSelector:
      matchLabels:
        kubernetes.io/os: linux
  action:
    type: node-drain
    parameters:
      gracePeriodSeconds: "30"
      deleteEmptyDirData: "true"
      ignoreDaemonSets: "true"
  duration: 30s
