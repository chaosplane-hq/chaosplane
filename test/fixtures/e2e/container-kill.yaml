apiVersion: chaos.chaosplane.dev/v1alpha1
kind: ChaosExperiment
metadata:
  name: e2e-container-kill
  namespace: default
  labels:
    test: e2e
spec:
  target:
    kind: Pod
    namespace: default
    labelSelector:
      matchLabels:
        app: e2e-target
  action:
    type: container-kill
    parameters:
      containerName: main
      signal: "9"
  duration: 30s
