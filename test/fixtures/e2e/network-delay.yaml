apiVersion: chaos.chaosplane.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: e2e-network-delay
  namespace: default
  labels:
    test: e2e
spec:
  target:
    kind: Pod
    namespace: default
    labelSelector:
      matchLabels:
        app: e2e-target
  action:
    type: network-delay
    parameters:
      latencyMs: "200"
      jitterMs: "50"
      interface: eth0
  duration: 30s
