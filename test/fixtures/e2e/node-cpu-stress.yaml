apiVersion: chaos.chaosplane.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: e2e-node-cpu-stress
  namespace: default
  labels:
    test: e2e
spec:
  target:
    kind: Node
    labelSelector:
      matchLabels:
        kubernetes.io/os: linux
  action:
    type: node-cpu-stress
    parameters:
      cores: "1"
      loadPercent: "80"
  duration: 30s
