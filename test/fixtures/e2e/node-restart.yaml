apiVersion: chaos.chaosplane.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: e2e-node-restart
  namespace: default
  labels:
    test: e2e
spec:
  target:
    kind: Node
    labelSelector:
      matchLabels:
        kubernetes.io/os: linux
  action:
    type: node-restart
    parameters:
      timeoutSeconds: "60"
  duration: 30s
