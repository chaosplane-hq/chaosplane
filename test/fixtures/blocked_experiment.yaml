apiVersion: chaos.chaosplane.dev/v1alpha1
kind: ChaosExperiment
metadata:
  name: blocked-experiment
  namespace: production
spec:
  target:
    kind: Pod
    namespace: kube-system
    names:
      - coredns-primary
      - coredns-secondary
      - etcd-master
      - kube-apiserver
  action:
    type: node-drain
    duration: "30m"
  duration: "30m"
